root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o /tmp/chisa-api ./cmd/api"
bin = "/tmp/chisa-api"
include_ext = ["go"]
exclude_dir = ["tmp", "vendor", "migrations"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[color]
main = "cyan"
watcher = "yellow"
build = "green"
runner = "magenta"

[misc]
clean_on_exit = true
